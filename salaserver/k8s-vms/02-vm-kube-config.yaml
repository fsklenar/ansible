---
- hosts: "{{ target_hosts | default('vms') }}"
  become: true
  vars_files:
    - ../vars/common_vars.yaml

  vars:
    cloudflare_tunnel_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"

  tasks:

    - block:

        - name: Configure kube config (only on control-plane node)
          shell: |
            if [ ! -f $HOME/.kube/config ]; then
                mkdir -p $HOME/.kube
                sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
                sudo chown $(id -u):$(id -g) $HOME/.kube/config
            fi

        - name: create /srv/data folder
          file:
            path: /srv/data
            state: directory
            mode: '0750'
            owner: "{{ server_username }}"
            group: "root"

        # - name: Copy do-port-forward.sh script
        #   copy:
        #     src: scripts/do-port-forward.sh
        #     dest: /srv/data
        #     mode: '0740'
        #     group: "{{ server_username }}"
        #     owner: root
        #
        # - name: Crontab - port-forward to public server every 5 minutes
        #   ansible.builtin.cron:
        #       name: "port forward"
        #       minute: "*/5"
        #       hour: "*"
        #       job: "/srv/data/do-port-forward.sh"

        # add CloudFlareD installation
        - name: Ensure keyrings directory exists
          ansible.builtin.file:
            path: /usr/share/keyrings
            state: directory
            mode: '0755'
            owner: root
            group: root

        - name: Download and install Cloudflare GPG key
          ansible.builtin.get_url:
            url: https://pkg.cloudflare.com/cloudflare-main.gpg
            dest: /usr/share/keyrings/cloudflare-main.gpg
            mode: '0644'
            owner: root
            group: root

        - name: Add cloudflared apt repository
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
            filename: cloudflared
            state: present
          register: cloudflared_repo

        - name: Update apt cache if repo was added/changed
          ansible.builtin.apt:
            update_cache: true
          when: cloudflared_repo.changed

        - name: Install cloudflared
          ansible.builtin.apt:
            name: cloudflared
            state: present

        # - name: Check if cloudflared systemd service already exists
        #   ansible.builtin.stat:
        #     path: /etc/systemd/system/cloudflared.service
        #   register: cloudflared_service_file

        - name: Uninstall existing cloudflared service (if present)
          ansible.builtin.command:
            cmd: "cloudflared service uninstall"
          become: true
          failed_when: false  # equivalent to "|| true"

        - name: Install cloudflared service with token
          ansible.builtin.command:
            cmd: "cloudflared service install {{ cloudflare_tunnel_token }}"
          become: true

#         - name: Install cloudflared service with token
#           ansible.builtin.shell:
# #            cmd: "cloudflared service install {{ cloudflare_tunnel_token }}"
#             cmd: "cloudflared service uninstall || true; cloudflared service install {{ cloudflare_tunnel_token }}"
#           become: true
          # no_log: true
          # when: not cloudflared_service_file.stat.exists


        # avoid: "WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!
        - name: Remove the old fingerprint of the external server from this machine
          ansible.builtin.known_hosts:
            # This points to the known_hosts file of the user on THIS server
            path: "/root/.ssh/known_hosts"
            name: "{{ haproxy_server }}"
            state: absent

        - name: "Optional: Automatically 're-learn' the new key (Non-interactive)"
          # This prevents the "Are you sure you want to connect?" prompt later
          ansible.builtin.shell: "ssh-keyscan -H {{ haproxy_server }} >> /root/.ssh/known_hosts"
          register: keyscan_result
          changed_when: "keyscan_result.rc == 0"
        #
        # - name: Test the connection to the external server
        #   ansible.builtin.command: "ssh -o BatchMode=yes {{ haproxy_server }} 'uptime'"
        #   register: ssh_test
        #   ignore_errors: yes
        #
        # - name: Report status
        #   ansible.builtin.debug:
        #     msg: "Connection test output: {{ ssh_test.stdout }}"


      when: 'controlplane_hostname  | string in inventory_hostname'
