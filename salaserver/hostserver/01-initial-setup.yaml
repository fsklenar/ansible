---
- name: Initial server setup
  hosts: all
  become: true
  vars_files:
    - ../vars/common_vars.yaml

  tasks:
    - name: Update all packages to the latest version
      ansible.builtin.apt:
        upgrade: full

    - name: Install aptitude
      ansible.builtin.apt:
        name: aptitude
        state: present
        update_cache: true

    - name: Create a new regular user with sudo privileges for "{{ ansible_username }}"
      ansible.builtin.user:
        name: "{{ ansible_username }}"
        state: present
        groups: sudo
        append: true
        create_home: true
        shell: /bin/bash

    - name: Create a new regular user with sudo privileges for "{{ server_username }}"
      ansible.builtin.user:
        name: "{{ server_username }}"
        state: present
        groups: sudo,{{ ansible_username }}
        append: true
        create_home: true
        shell: /bin/bash
      when: inventory_hostname != 'cloud-linuxadmin'


    - name: Setup passwordless sudo for "{{ ansible_username }}"
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^{{ ansible_username }}'
        line: '{{ ansible_username }} ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'

    - name: Setup passwordless sudo for {{ server_username }}
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^{{ server_username }}'
        line: '{{ server_username }} ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'
      when: inventory_hostname != 'cloud-linuxadmin'

    - name: Mitigations off
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        state: present
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT'
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="mitigations=off"'

    - name: Set timezone to Europe
      become: true
      community.general.timezone:
        name: Europe/Bratislava

    - name: Set authorized key for remote user
      ansible.posix.authorized_key:
        user: "{{ server_username }}"
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
      when: inventory_hostname != 'cloud-linuxadmin'

    - name: Set authorized key for ansible user
      ansible.posix.authorized_key:
        user: "{{ ansible_username }}"
        state: present
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_ed25519.pub') }}"
    #
    # - name: Set authorized key for ansible user
    #   ansible.posix.authorized_key:
    #     user: "{{ ansible_username }}"
    #     state: present
    #     key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/id_rsa_node.pub') }}"


    - name: Disable password authentication for root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'

    - name: SSH client KeepAlive interval
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_config
        state: present
        regexp: '^ServerAliveInterval 120'
        line: 'ServerAliveInterval 120'

    - name: SSH client KeepAlive interval part 2
      ansible.builtin.lineinfile:
        path: /etc/ssh/ssh_config
        state: present
        regexp: '^ServerAliveCountMax 2'
        line: 'ServerAliveCountMax 2'

    - name: Update apt and install required system packages
      ansible.builtin.apt:
        pkg:
          - curl
          - vim
          - git
          - ufw
          - cpu-checker
          - gh
          - virt-top
        state: present
        update_cache: true
      when: "'servers' in group_names"

    - name: CloudflaredD in salaserver
      when: "'servers' in group_names"
      block:
        - name: Install prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present
            update_cache: true

        - name: Create directory for keyrings
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'

        - name: Download Cloudflare GPG keyring
          ansible.builtin.get_url:
            url: https://pkg.cloudflare.com/cloudflare-main.gpg
            dest: /etc/apt/keyrings/cloudflare-main.gpg
            mode: '0644'

        - name: Add Cloudflare apt repository (Deb822 format)
          ansible.builtin.deb822_repository:
            name: cloudflared
            types: deb
            uris: https://pkg.cloudflare.com/cloudflared
            suites: any
            components: main
            signed_by: /etc/apt/keyrings/cloudflare-main.gpg
            state: present
          register: cloudflared_repo

        - name: Update apt cache if repository was added or changed
          ansible.builtin.apt:
            update_cache: true
          when: cloudflared_repo.changed

        - name: Install cloudflared package
          ansible.builtin.apt:
            name: cloudflared
            state: present
